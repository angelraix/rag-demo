<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filings Intelligence</title>
  <style>
    :root {
      --bg:        #0f1117;
      --surface:   #1a1d27;
      --border:    #2a2d3e;
      --accent:    #6366f1;
      --accent-hi: #818cf8;
      --text:      #e2e8f0;
      --muted:     #64748b;
      --green:     #10b981;
      --radius:    10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Nav ── */
    nav {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 16px 32px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .nav-logo {
      font-size: 17px;
      font-weight: 700;
      color: var(--accent-hi);
      margin-right: 20px;
      letter-spacing: -0.3px;
    }
    nav a {
      text-decoration: none;
      color: var(--muted);
      font-size: 14px;
      padding: 6px 14px;
      border-radius: 6px;
      transition: color .15s, background .15s;
    }
    nav a:hover  { color: var(--text); background: var(--border); }
    nav a.active { color: var(--text); background: var(--border); }

    /* ── Layout ── */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 56px 20px 40px;
    }

    .hero {
      text-align: center;
      margin-bottom: 40px;
    }
    .hero h1 {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -0.8px;
      background: linear-gradient(135deg, #e2e8f0 0%, var(--accent-hi) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
    }
    .hero p {
      color: var(--muted);
      font-size: 15px;
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      width: 100%;
      max-width: 720px;
    }

    /* ── Controls ── */
    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    label {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .6px;
    }
    select {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 14px;
      padding: 8px 12px;
      outline: none;
      cursor: pointer;
    }
    select:focus { border-color: var(--accent); }

    textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 15px;
      padding: 12px 14px;
      resize: vertical;
      min-height: 90px;
      outline: none;
      font-family: inherit;
      line-height: 1.5;
    }
    textarea:focus { border-color: var(--accent); }
    textarea::placeholder { color: var(--muted); }

    .btn-row {
      display: flex;
      justify-content: flex-end;
      margin-top: 14px;
    }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 7px;
      font-size: 14px;
      font-weight: 600;
      padding: 10px 24px;
      cursor: pointer;
      transition: background .15s, opacity .15s;
    }
    button:hover:not(:disabled) { background: var(--accent-hi); }
    button:disabled { opacity: .45; cursor: not-allowed; }

    /* ── Answer ── */
    .answer-wrap {
      margin-top: 24px;
      display: none;
    }
    .answer-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .6px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse 1s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; }
      50%      { opacity: .3; }
    }
    .dot.done { animation: none; background: var(--muted); }

    #answer {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px 18px;
      font-size: 15px;
      line-height: 1.7;
      white-space: pre-wrap;
      min-height: 60px;
    }

    /* ── Chips (from roles page) ── */
    .prefill-banner {
      background: #1e1b4b;
      border: 1px solid #4338ca;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 20px;
      font-size: 13px;
      color: #a5b4fc;
      display: none;
    }
    .prefill-banner strong { color: #c7d2fe; }
  </style>
</head>
<body>

<nav>
  <span class="nav-logo">⬡ FilingsIQ</span>
  <a href="/" class="active">Query</a>
  <a href="/models.html">Model Compare</a>
  <a href="/roles.html">CxO Playbook</a>
</nav>

<main>
  <div class="hero">
    <h1>Ask Your Filings</h1>
    <p>Retrieval-augmented answers grounded in your customers' SEC filings.</p>
  </div>

  <div id="prefill-banner" class="prefill-banner"></div>

  <div class="card">
    <div class="controls">
      <div class="field">
        <label>Customer</label>
        <select id="customer"></select>
      </div>
    </div>

    <div class="field" style="margin-bottom:0">
      <label>Question</label>
      <textarea id="question" placeholder="What are the key risk factors for this company?"></textarea>
    </div>

    <div class="btn-row">
      <button id="ask-btn" onclick="ask()">Ask →</button>
    </div>
  </div>

  <div class="answer-wrap card" id="answer-wrap" style="margin-top:20px; display:none;">
    <div class="answer-label">
      <span class="dot" id="dot"></span>
      <span id="answer-status">Generating…</span>
    </div>
    <div id="answer"></div>
  </div>
</main>

<script>
  // ── Load customers from server ──
  async function loadCustomers() {
    try {
      const res = await fetch("/customers");
      const { customers } = await res.json();
      const sel = document.getElementById("customer");
      if (customers.length === 0) {
        sel.innerHTML = '<option value="">No customers ingested yet</option>';
        return;
      }
      sel.innerHTML = customers.map(c =>
        `<option value="${c}">${c.replace(/_/g," ").replace(/\b\w/g,l=>l.toUpperCase())}</option>`
      ).join("");
    } catch(e) {
      console.error("Could not load customers", e);
    }
  }

  // ── Check for pre-fill from CxO Playbook page ──
  (function checkPrefill() {
    const params = new URLSearchParams(location.search);
    const q    = params.get("q");
    const role = params.get("role");
    if (q) {
      document.getElementById("question").value = q;
      if (role) {
        const banner = document.getElementById("prefill-banner");
        banner.style.display = "block";
        banner.innerHTML = `<strong>${role} lens applied</strong> — role-specific system prompt will be included with your query.`;
      }
      // Auto-fire after customers load
      window._autofire = true;
    }
  })();

  loadCustomers().then(() => {
    if (window._autofire) ask();
  });

  // ── Main ask function ──
  async function ask() {
    const question    = document.getElementById("question").value.trim();
    const customer_id = document.getElementById("customer").value;
    if (!question || !customer_id) return;

    const params   = new URLSearchParams(location.search);
    const role_prompt = params.get("role_prompt") || null;

    const btn       = document.getElementById("ask-btn");
    const wrap      = document.getElementById("answer-wrap");
    const answerEl  = document.getElementById("answer");
    const dot       = document.getElementById("dot");
    const statusEl  = document.getElementById("answer-status");

    btn.disabled = true;
    wrap.style.display = "block";
    answerEl.textContent = "";
    dot.className = "dot";
    statusEl.textContent = "Retrieving context…";

    try {
      const res = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, customer_id, model: "claude-sonnet-5", role_prompt })
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({ detail: res.statusText }));
        answerEl.textContent = "Error: " + (err.detail || res.statusText);
        dot.className = "dot done";
        statusEl.textContent = "Error";
        btn.disabled = false;
        return;
      }

      statusEl.textContent = "Generating…";
      const reader  = res.body.getReader();
      const decoder = new TextDecoder();

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        answerEl.textContent += decoder.decode(value, { stream: true });
      }

      dot.className = "dot done";
      statusEl.textContent = "Complete";
    } catch(e) {
      answerEl.textContent = "Network error: " + e.message;
      dot.className = "dot done";
      statusEl.textContent = "Error";
    }

    btn.disabled = false;
  }

  // Allow Ctrl+Enter to submit
  document.getElementById("question").addEventListener("keydown", e => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) ask();
  });
</script>
</body>
</html>
